name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.15.0
      - name: Require a tag from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-release.mjs "$GITHUB_REF_NAME"
      - run: npm test
      - name: Prepare GitHub release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_args=("$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
      - name: Publish to npm with provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          if existing_sha="$(npm view "next-job-kit@$version" gitHead --json 2>/dev/null)"; then
            existing_sha="$(tr -d '"' <<< "$existing_sha")"
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "npm version already exists from a different commit: $existing_sha" >&2
              exit 1
            fi
          elif [[ "$version" == *-* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
          published_version=""
          for attempt in {1..12}; do
            if published_version="$(npm view "next-job-kit@$version" version 2>/dev/null)"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "npm metadata did not propagate after 12 attempts" >&2
              exit 1
            fi
            echo "Waiting for npm metadata to propagate (attempt $attempt/12)..."
            sleep 5
          done
          test "$published_version" = "$version"
      - name: Smoke-test the published CLI
        working-directory: ${{ runner.temp }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          reported="$(npm exec --yes --package="next-job-kit@$version" -- next-job-kit --version)"
          test "$reported" = "$version"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
