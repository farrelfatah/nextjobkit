name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The minimum supported runtime from package.json engines, plus current LTS.
        node: ["22.14.0", "24"]
    steps:
      # CLAUDE.md and .claude/skills are committed symlinks; Windows checkouts
      # need symlink support or they arrive as plain files.
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
